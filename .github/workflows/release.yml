# For a Tilde version tag such as v0.2.0: builds Tilde.app and tproxy for every node type, and
# attaches them to a draft GitHub release of that tag. Tilde of that version downloads tproxy
# from it and accepts only the hashes in proxy/SHA256SUMS: a build that differs fails here.
# Publish the draft by hand.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - name: Build tproxy and check the hashes
        run: proxy/build.sh --check
      - name: Check the version
        run: grep -q "<key>CFBundleShortVersionString</key><string>${GITHUB_REF_NAME#v}</string>" scripts/build-app.sh
      - name: Build Tilde
        run: |
          TILDE_UNIVERSAL=1 scripts/build-app.sh
          ditto -c -k --keepParent build/Tilde.app build/Tilde.zip
      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "Tilde $GITHUB_REF_NAME" --notes "Tilde $GITHUB_REF_NAME" build/Tilde.zip proxy/dist/tproxy-*
