# Builds tilde-proxy for every node type and attaches the files to a draft GitHub release, for
# a tag such as tilde-proxy-v1.0.0. The build must give the bytes in proxy/SHA256SUMS, which
# Tilde has built in: a release that differs fails here. Publish the draft by hand.
name: tilde-proxy release

on:
  push:
    tags: ["tilde-proxy-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - name: Build and check the hashes
        run: proxy/build.sh
      - name: Check the version
        run: test "tilde-proxy-v$(cd proxy && go run . --version)" = "$GITHUB_REF_NAME"
      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes "tilde-proxy for Tilde's remote machines." proxy/dist/*
