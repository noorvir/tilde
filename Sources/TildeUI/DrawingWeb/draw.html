<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="draw.css">
<style>
html, body, #root { margin: 0; height: 100%; background: transparent; overflow: hidden; }
/* Above the wireframe's look layer: text shows on top of the components. */
#root { position: relative; z-index: 4; }
.excalidraw { --color-surface-lowest: transparent; background: transparent !important; }
.excalidraw .layer-ui__wrapper, .excalidraw .welcome-screen-center { display: none !important; }
</style>
<div id="root"></div>
<script>
window.EXCALIDRAW_ASSET_PATH = "./";
window.process = { env: {} };
const report = (text) => window.webkit?.messageHandlers?.tilde?.postMessage("error: " + text);
addEventListener("error", (event) => report(event.message + " " + event.filename + ":" + event.lineno));
addEventListener("unhandledrejection", (event) => report(String(event.reason)));
</script>
<script src="draw.js"></script>
